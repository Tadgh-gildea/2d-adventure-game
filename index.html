
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forest Adventure</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #111827;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 {
  margin: 16px 0 5px;
  color: #facc15;
}

p {
  margin: 5px 0 12px;
  color: #d1d5db;
}

canvas {
  width: min(95vw, 800px);
  height: auto;
  border: 4px solid #d6b36a;
  border-radius: 8px;
  display: block;
  margin: auto;
  image-rendering: pixelated;
}

.controls {
  color: #9ca3af;
  margin: 12px;
  font-size: 14px;
}
</style>
</head>

<body>

<h1>🌲 Forest Adventure 🌲</h1>
<p>Explore the forest and collect all the coins!</p>

<canvas id="game" width="800" height="500"></canvas>

<div class="controls">
  Move: WASD or Arrow Keys
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const player = {
  x: 380,
  y: 250,
  w: 24,
  h: 30,
  speed: 3,
  facing: "down"
};

const keys = {};

let coinsCollected = 0;

// Trees
const trees = [
  {x: 100, y: 100},
  {x: 220, y: 80},
  {x: 650, y: 100},
  {x: 700, y: 250},
  {x: 120, y: 350},
  {x: 300, y: 400},
  {x: 550, y: 380},
  {x: 620, y: 300}
];

// Rocks
const rocks = [
  {x: 350, y: 120},
  {x: 480, y: 200},
  {x: 200, y: 250},
  {x: 500, y: 420}
];

// Coins
const coins = [
  {x: 170, y: 170, collected: false},
  {x: 420, y: 100, collected: false},
  {x: 600, y: 180, collected: false},
  {x: 350, y: 330, collected: false},
  {x: 700, y: 400, collected: false},
  {x: 450, y: 350, collected: false}
];

window.addEventListener("keydown", (e) => {
  keys[e.key.toLowerCase()] = true;

  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) {
    e.preventDefault();
  }
});

window.addEventListener("keyup", (e) => {
  keys[e.key.toLowerCase()] = false;
});

function collides(x, y, w, h, obj, ow, oh) {
  return (
    x < obj.x + ow &&
    x + w > obj.x &&
    y < obj.y + oh &&
    y + h > obj.y
  );
}

function blocked(x, y) {
  // Tree collision
  for (const tree of trees) {
    if (collides(x, y, player.w, player.h, 
                 {x: tree.x - 15, y: tree.y + 8}, 50, 35)) {
      return true;
    }
  }

  // Rock collision
  for (const rock of rocks) {
    if (collides(x, y, player.w, player.h, 
                 {x: rock.x - 8, y: rock.y - 5}, 32, 25)) {
      return true;
    }
  }

  return false;
}

function update() {
  let dx = 0;
  let dy = 0;

  if (keys["w"] || keys["arrowup"]) {
    dy -= player.speed;
    player.facing = "up";
  }

  if (keys["s"] || keys["arrowdown"]) {
    dy += player.speed;
    player.facing = "down";
  }

  if (keys["a"] || keys["arrowleft"]) {
    dx -= player.speed;
    player.facing = "left";
  }

  if (keys["d"] || keys["arrowright"]) {
    dx += player.speed;
    player.facing = "right";
  }

  // Prevent faster diagonal movement
  if (dx !== 0 && dy !== 0) {
    dx *= 0.707;
    dy *= 0.707;
  }

  // Horizontal movement
  if (!blocked(player.x + dx, player.y)) {
    player.x += dx;
  }

  // Vertical movement
  if (!blocked(player.x, player.y + dy)) {
    player.y += dy;
  }

  // Screen boundaries
  player.x = Math.max(0, Math.min(canvas.width - player.w, player.x));
  player.y = Math.max(0, Math.min(canvas.height - player.h, player.y));

  // Collect coins
  for (const coin of coins) {
    if (!coin.collected && collides(
      player.x, player.y, player.w, player.h,
      {x: coin.x - 10, y: coin.y - 10}, 20, 20
    )) {
      coin.collected = true;
      coinsCollected++;
    }
  }
}

function drawGrass() {
  // Main grass
  ctx.fillStyle = "#4b8b38";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Grass details
  for (let x = 0; x < canvas.width; x += 35) {
    for (let y = 0; y < canvas.height; y += 35) {
      ctx.fillStyle = ((x + y) % 70 === 0) ? "#559541" : "#438132";
      ctx.fillRect(x + 5, y + 8, 3, 3);
      ctx.fillRect(x + 20, y + 22, 3, 3);
    }
  }

  // Decorative flowers
  for (let i = 0; i < 18; i++) {
    let x = (i * 137 + 40) % 780;
    let y = (i * 91 + 30) % 470;

    ctx.fillStyle = "#f9e8a0";
    ctx.fillRect(x, y, 4, 4);
  }
}

function drawTree(tree) {
  // Shadow
  ctx.fillStyle = "#315d28";
  ctx.beginPath();
  ctx.ellipse(tree.x, tree.y + 25, 28, 12, 0, 0, Math.PI * 2);
  ctx.fill();

  // Trunk
  ctx.fillStyle = "#79502d";
  ctx.fillRect(tree.x - 8, tree.y + 5, 16, 25);

  // Tree leaves
  ctx.fillStyle = "#245c32";
  ctx.beginPath();
  ctx.arc(tree.x, tree.y, 28, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#398344";
  ctx.beginPath();
  ctx.arc(tree.x - 10, tree.y - 8, 20, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#55a34b";
  ctx.beginPath();
  ctx.arc(tree.x + 9, tree.y - 10, 16, 0, Math.PI * 2);
  ctx.fill();

  // Highlight
  ctx.fillStyle = "#78ba56";
  ctx.fillRect(tree.x - 10, tree.y - 17, 8, 5);
}

function drawRock(rock) {
  // Shadow
  ctx.fillStyle = "#52604a";
  ctx.beginPath();
  ctx.ellipse(rock.x, rock.y + 9, 19, 9, 0, 0, Math.PI * 2);
  ctx.fill();

  // Rock
  ctx.fillStyle = "#858c91";
  ctx.beginPath();
  ctx.moveTo(rock.x - 15, rock.y + 5);
  ctx.lineTo(rock.x - 10, rock.y - 10);
  ctx.lineTo(rock.x + 2, rock.y - 16);
  ctx.lineTo(rock.x + 14, rock.y - 7);
  ctx.lineTo(rock.x + 17, rock.y + 5);
  ctx.closePath();
  ctx.fill();

  // Highlight
  ctx.fillStyle = "#b5bdc3";
  ctx.fillRect(rock.x - 6, rock.y - 8, 8, 4);
}

function drawCoin(coin) {
  if (coin.collected) return;

  // Coin shadow
  ctx.fillStyle = "#8b6510";
  ctx.beginPath();
  ctx.arc(coin.x + 2, coin.y + 2, 9, 0, Math.PI * 2);
  ctx.fill();

  // Coin
  ctx.fillStyle = "#facc15";
  ctx.beginPath();
  ctx.arc(coin.x, coin.y, 8, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = "#fff2a6";
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.fillStyle = "#fff4b0";
  ctx.fillRect(coin.x - 2, coin.y - 4, 3, 8);
}

function drawPlayer() {
  // Shadow
  ctx.fillStyle = "rgba(0,0,0,0.25)";
  ctx.fillRect(player.x + 3, player.y + 25, 20, 6);

  // Legs
  ctx.fillStyle = "#49301e";
  ctx.fillRect(player.x + 4, player.y + 20, 6, 9);
  ctx.fillRect(player.x + 14, player.y + 20, 6, 9);

  // Boots
  ctx.fillStyle = "#6b4225";
  ctx.fillRect(player.x + 2, player.y + 26, 9, 4);
  ctx.fillRect(player.x + 13, player.y + 26, 9, 4);

  // Body
  ctx.fillStyle = "#2563eb";
  ctx.fillRect(player.x + 3, player.y + 10, 18, 13);

  // Shirt highlight
  ctx.fillStyle = "#60a5fa";
  ctx.fillRect(player.x + 5, player.y + 11, 5, 9);

  // Head
  ctx.fillStyle = "#f1c27d";
  ctx.fillRect(player.x + 5, player.y + 2, 14, 12);

  // Hair
  ctx.fillStyle = "#713f12";
  ctx.fillRect(player.x + 4, player.y, 16, 5);
  ctx.fillRect(player.x + 4, player.y + 2, 4, 7);

  // Eyes based on direction
  ctx.fillStyle = "#222";

  if (player.facing === "down") {
    ctx.fillRect(player.x + 8, player.y + 8, 2, 2);
    ctx.fillRect(player.x + 15, player.y + 8, 2, 2);
  } else if (player.facing === "up") {
    ctx.fillStyle = "#713f12";
    ctx.fillRect(player.x + 6, player.y + 3, 12, 4);
  } else if (player.facing === "left") {
    ctx.fillRect(player.x + 6, player.y + 8, 2, 2);
  } else if (player.facing === "right") {
    ctx.fillRect(player.x + 16, player.y + 8, 2, 2);
  }

  // Green adventure hat
  ctx.fillStyle = "#166534";
  ctx.fillRect(player.x + 2, player.y - 2, 20, 5);
  ctx.fillRect(player.x + 7, player.y - 7, 12, 7);

  ctx.fillStyle = "#22c55e";
  ctx.fillRect(player.x + 9, player.y - 6, 6, 3);
}

function drawHUD() {
  // HUD panel
  ctx.fillStyle = "rgba(20, 35, 20, 0.85)";
  ctx.fillRect(12, 12, 170, 42);

  ctx.strokeStyle = "#d6b36a";
  ctx.lineWidth = 2;
  ctx.strokeRect(12, 12, 170, 42);

  // Coin counter
  ctx.fillStyle = "#facc15";
  ctx.beginPath();
  ctx.arc(32, 33, 9, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 18px Arial";
  ctx.fillText("Coins: " + coinsCollected + " / " + coins.length, 50, 39);

  // Victory message
  if (coinsCollected === coins.length) {
    ctx.fillStyle = "rgba(0,0,0,0.7)";
    ctx.fillRect(180, 190, 440, 100);

    ctx.fillStyle = "#facc15";
    ctx.font = "bold 30px Arial";
    ctx.fillText("YOU FOUND ALL THE COINS!", 205, 245);

    ctx.fillStyle = "#ffffff";
    ctx.font = "16px Arial";
    ctx.fillText("You're a forest treasure hunter!", 280, 272);
  }
}

function draw() {
  drawGrass();

  // Draw scenery
  for (const tree of trees) drawTree(tree);
  for (const rock of rocks) drawRock(rock);
  for (const coin of coins) drawCoin(coin);

  drawPlayer();
  drawHUD();
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
