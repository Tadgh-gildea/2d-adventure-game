
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forest Adventure - Level 2</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #101827;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 {
  color: #facc15;
  margin: 12px;
}

p { color: #cbd5e1; }

canvas {
  width: min(96vw, 900px);
  height: auto;
  border: 4px solid #b58b48;
  border-radius: 8px;
  display: block;
  margin: auto;
  image-rendering: pixelated;
}

.controls {
  padding: 10px;
  color: #94a3b8;
  font-size: 14px;
}
</style>
</head>

<body>

<h1>⚔️ Forest Adventure II ⚔️</h1>
<p>Explore the forest, defeat slimes and survive!</p>

<canvas id="game" width="900" height="550"></canvas>

<div class="controls">
  WASD / Arrow Keys = Move | SPACE = Attack | R = Restart
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const WORLD = {
  width: 2200,
  height: 1600
};

const keys = {};

const player = {
  x: 400,
  y: 400,
  w: 28,
  h: 34,
  speed: 3.2,
  facing: "down",
  health: 5,
  maxHealth: 5,
  attackTimer: 0,
  attackCooldown: 0,
  invincible: 0,
  kills: 0
};

let gameOver = false;
let victory = false;

const camera = { x: 0, y: 0 };

const trees = [];
const rocks = [];
const enemies = [];

function random(min, max) {
  return Math.random() * (max - min) + min;
}

// Generate forest scenery
for (let i = 0; i < 90; i++) {
  trees.push({
    x: random(50, WORLD.width - 100),
    y: random(50, WORLD.height - 100)
  });
}

for (let i = 0; i < 65; i++) {
  rocks.push({
    x: random(50, WORLD.width - 80),
    y: random(50, WORLD.height - 80)
  });
}

// Create slimes
for (let i = 0; i < 12; i++) {
  enemies.push({
    x: random(150, WORLD.width - 150),
    y: random(150, WORLD.height - 150),
    w: 28,
    h: 24,
    speed: random(0.7, 1.2),
    health: 2,
    alive: true,
    hitFlash: 0
  });
}

window.addEventListener("keydown", e => {
  const key = e.key.toLowerCase();

  if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(key)) {
    e.preventDefault();
  }

  keys[key] = true;

  if (key === " " && !gameOver && !victory) attack();
  if (key === "r") restart();
});

window.addEventListener("keyup", e => {
  keys[e.key.toLowerCase()] = false;
});

function rectCollision(x, y, w, h, obj) {
  return (
    x < obj.x + obj.w &&
    x + w > obj.x &&
    y < obj.y + obj.h &&
    y + h > obj.y
  );
}

function blocked(x, y) {
  const box = { x, y, w: player.w, h: player.h };

  for (const tree of trees) {
    const obstacle = {
      x: tree.x - 18,
      y: tree.y + 5,
      w: 36,
      h: 32
    };

    if (rectCollision(box.x, box.y, box.w, box.h, obstacle)) {
      return true;
    }
  }

  for (const rock of rocks) {
    const obstacle = {
      x: rock.x - 12,
      y: rock.y - 8,
      w: 26,
      h: 22
    };

    if (rectCollision(box.x, box.y, box.w, box.h, obstacle)) {
      return true;
    }
  }

  for (const enemy of enemies) {
    if (!enemy.alive) continue;

    if (rectCollision(box.x, box.y, box.w, box.h, enemy)) {
      return true;
    }
  }

  return false;
}

function attack() {
  if (player.attackCooldown > 0) return;

  player.attackTimer = 12;
  player.attackCooldown = 25;

  let range = 48;

  let hitbox = {
    x: player.x,
    y: player.y,
    w: player.w,
    h: player.h
  };

  if (player.facing === "up") {
    hitbox.y -= range;
    hitbox.h = range;
  }

  if (player.facing === "down") {
    hitbox.y += player.h;
    hitbox.h = range;
  }

  if (player.facing === "left") {
    hitbox.x -= range;
    hitbox.w = range;
  }

  if (player.facing === "right") {
    hitbox.x += player.w;
    hitbox.w = range;
  }

  for (const enemy of enemies) {
    if (!enemy.alive) continue;

    if (rectCollision(hitbox.x, hitbox.y, hitbox.w, hitbox.h, enemy)) {
      enemy.health--;
      enemy.hitFlash = 8;

      if (enemy.health <= 0) {
        enemy.alive = false;
        player.kills++;

        if (player.kills >= enemies.length) {
          victory = true;
        }
      }
    }
  }
}

function update() {
  if (gameOver || victory) return;

  let dx = 0;
  let dy = 0;

  if (keys["w"] || keys["arrowup"]) {
    dy -= player.speed;
    player.facing = "up";
  }

  if (keys["s"] || keys["arrowdown"]) {
    dy += player.speed;
    player.facing = "down";
  }

  if (keys["a"] || keys["arrowleft"]) {
    dx -= player.speed;
    player.facing = "left";
  }

  if (keys["d"] || keys["arrowright"]) {
    dx += player.speed;
    player.facing = "right";
  }

  // Normalize diagonal movement
  if (dx && dy) {
    dx *= 0.707;
    dy *= 0.707;
  }

  // Move player
  if (!blocked(player.x + dx, player.y)) {
    player.x += dx;
  }

  if (!blocked(player.x, player.y + dy)) {
    player.y += dy;
  }

  // World boundaries
  player.x = Math.max(0, Math.min(WORLD.width - player.w, player.x));
  player.y = Math.max(0, Math.min(WORLD.height - player.h, player.y));

  if (player.attackTimer > 0) player.attackTimer--;
  if (player.attackCooldown > 0) player.attackCooldown--;
  if (player.invincible > 0) player.invincible--;

  // Slime AI
  for (const enemy of enemies) {
    if (!enemy.alive) continue;

    if (enemy.hitFlash > 0) enemy.hitFlash--;

    const distX = player.x - enemy.x;
    const distY = player.y - enemy.y;
    const distance = Math.sqrt(distX * distX + distY * distY);

    // Chase player when nearby
    if (distance < 280 && distance > 35) {
      const moveX = (distX / distance) * enemy.speed;
      const moveY = (distY / distance) * enemy.speed;

      const nextX = enemy.x + moveX;
      const nextY = enemy.y + moveY;

      // Avoid trees and rocks
      let blockedEnemy = false;

      for (const tree of trees) {
        if (rectCollision(nextX, nextY, enemy.w, enemy.h,
          {x: tree.x - 18, y: tree.y + 5, w: 36, h: 32})) {
          blockedEnemy = true;
        }
      }

      for (const rock of rocks) {
        if (rectCollision(nextX, nextY, enemy.w, enemy.h,
          {x: rock.x - 12, y: rock.y - 8, w: 26, h: 22})) {
          blockedEnemy = true;
        }
      }

      if (!blockedEnemy) {
        enemy.x = nextX;
        enemy.y = nextY;
      }
    }

    // Damage player
    if (rectCollision(player.x, player.y, player.w, player.h, enemy)) {
      if (player.invincible <= 0) {
        player.health--;
        player.invincible = 80;

        if (player.health <= 0) {
          gameOver = true;
        }
      }
    }
  }

  // Camera follows player
  camera.x = player.x + player.w / 2 - canvas.width / 2;
  camera.y = player.y + player.h / 2 - canvas.height / 2;

  camera.x = Math.max(0, Math.min(WORLD.width - canvas.width, camera.x));
  camera.y = Math.max(0, Math.min(WORLD.height - canvas.height, camera.y));
}

function drawGrass() {
  ctx.fillStyle = "#45843a";
  ctx.fillRect(0, 0, WORLD.width, WORLD.height);

  // Repeating grass pattern
  for (let x = 0; x < WORLD.width; x += 40) {
    for (let y = 0; y < WORLD.height; y += 40) {
      ctx.fillStyle = ((x + y) % 80 === 0) ? "#4d913f" : "#3d7934";
      ctx.fillRect(x + 8, y + 12, 3, 3);
      ctx.fillRect(x + 25, y + 28, 3, 3);
    }
  }
}

function drawTree(tree) {
  // Trunk
  ctx.fillStyle = "#754321";
  ctx.fillRect(tree.x - 8, tree.y + 4, 16, 24);

  // Leaves
  ctx.fillStyle = "#20582e";
  ctx.beginPath();
  ctx.arc(tree.x, tree.y, 27, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#347c3e";
  ctx.beginPath();
  ctx.arc(tree.x - 10, tree.y - 10, 20, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#55a64b";
  ctx.beginPath();
  ctx.arc(tree.x + 9, tree.y - 12, 16, 0, Math.PI * 2);
  ctx.fill();
}

function drawRock(rock) {
  ctx.fillStyle = "#737e85";
  ctx.beginPath();
  ctx.ellipse(rock.x, rock.y, 16, 12, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#aeb8bd";
  ctx.fillRect(rock.x - 7, rock.y - 6, 7, 4);
}

function drawPlayer() {
  // Blink while hurt
  if (player.invincible > 0 && Math.floor(player.invincible / 5) % 2 === 0) {
    return;
  }

  const x = player.x;
  const y = player.y;

  // Shadow
  ctx.fillStyle = "#244822";
  ctx.fillRect(x + 3, y + 29, 23, 7);

  // Boots
  ctx.fillStyle = "#704523";
  ctx.fillRect(x + 3, y + 25, 9, 8);
  ctx.fillRect(x + 16, y + 25, 9, 8);

  // Body
  ctx.fillStyle = "#2563eb";
  ctx.fillRect(x + 4, y + 11, 20, 16);

  ctx.fillStyle = "#60a5fa";
  ctx.fillRect(x + 6, y + 12, 6, 10);

  // Head
  ctx.fillStyle = "#f0c27b";
  ctx.fillRect(x + 6, y + 3, 16, 12);

  // Hair
  ctx.fillStyle = "#713f12";
  ctx.fillRect(x + 5, y + 1, 18, 5);

  // Hat
  ctx.fillStyle = "#166534";
  ctx.fillRect(x + 2, y - 3, 24, 5);
  ctx.fillRect(x + 7, y - 8, 16, 7);

  ctx.fillStyle = "#4ade80";
  ctx.fillRect(x + 10, y - 6, 7, 3);

  // Eyes
  ctx.fillStyle = "#111827";

  if (player.facing === "down") {
    ctx.fillRect(x + 9, y + 9, 2, 2);
    ctx.fillRect(x + 17, y + 9, 2, 2);
  } else if (player.facing === "left") {
    ctx.fillRect(x + 8, y + 9, 2, 2);
  } else if (player.facing === "right") {
    ctx.fillRect(x + 18, y + 9, 2, 2);
  }

  // Sword attack
  if (player.attackTimer > 0) {
    ctx.fillStyle = "#e5e7eb";

    if (player.facing === "up") {
      ctx.fillRect(x + 10, y - 35, 8, 36);
    }

    if (player.facing === "down") {
      ctx.fillRect(x + 10, y + 32, 8, 36);
    }

    if (player.facing === "left") {
      ctx.fillRect(x - 35, y + 12, 36, 8);
    }

    if (player.facing === "right") {
      ctx.fillRect(x + 27, y + 12, 36, 8);
    }
  }
}

function drawEnemy(enemy) {
  if (!enemy.alive) return;

  // Shadow
  ctx.fillStyle = "#24542d";
  ctx.fillRect(enemy.x + 3, enemy.y + 20, 25, 6);

  // Slime body
  ctx.fillStyle = enemy.hitFlash > 0 ? "#ffffff" : "#22c55e";
  ctx.beginPath();
  ctx.ellipse(enemy.x + 14, enemy.y + 12, 14, 12, 0, Math.PI, 0);
  ctx.fill();
  ctx.fillRect(enemy.x, enemy.y + 12, 28, 8);

  // Eyes
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(enemy.x + 6, enemy.y + 9, 6, 7);
  ctx.fillRect(enemy.x + 17, enemy.y + 9, 6, 7);

  ctx.fillStyle = "#111827";
  ctx.fillRect(enemy.x + 8, enemy.y + 11, 3, 4);
  ctx.fillRect(enemy.x + 19, enemy.y + 11, 3, 4);
}

function drawHUD() {
  // Panel
  ctx.fillStyle = "rgba(15,23,42,0.85)";
  ctx.fillRect(15, 15, 220, 100);

  ctx.strokeStyle = "#d6b36a";
  ctx.lineWidth = 2;
  ctx.strokeRect(15, 15, 220, 100);

  // Health
  ctx.font = "22px Arial";
  ctx.fillStyle = "#ffffff";
  ctx.fillText("Health:", 28, 45);

  for (let i = 0; i < player.maxHealth; i++) {
    ctx.fillStyle = i < player.health ? "#ef4444" : "#4b5563";
    ctx.fillText("♥", 95 + i * 23, 45);
  }

  // Kills
  ctx.fillStyle = "#facc15";
  ctx.font = "18px Arial";
  ctx.fillText("Slimes: " + player.kills + " / " + enemies.length, 28, 82);

  // Map location
  ctx.fillStyle = "#d1d5db";
  ctx.font = "12px Arial";
  ctx.fillText("Forest Explorer", 28, 101);
}

function drawOverlay(title, subtitle) {
  ctx.fillStyle = "rgba(0,0,0,0.75)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.textAlign = "center";

  ctx.fillStyle = "#facc15";
  ctx.font = "bold 42px Arial";
  ctx.fillText(title, canvas.width / 2, canvas.height / 2 - 20);

  ctx.fillStyle = "#ffffff";
  ctx.font = "20px Arial";
  ctx.fillText(subtitle, canvas.width / 2, canvas.height / 2 + 30);

  ctx.textAlign = "left";
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.save();

  // Camera
  ctx.translate(-camera.x, -camera.y);

  drawGrass();

  for (const tree of trees) drawTree(tree);
  for (const rock of rocks) drawRock(rock);
  for (const enemy of enemies) drawEnemy(enemy);

  drawPlayer();

  ctx.restore();

  drawHUD();

  if (gameOver) {
    drawOverlay("GAME OVER", "Press R to try again");
  }

  if (victory) {
    drawOverlay("YOU WIN!", "You defeated every slime! Press R to play again");
  }
}

function restart() {
  player.x = 400;
  player.y = 400;
  player.health = player.maxHealth;
  player.kills = 0;
  player.invincible = 0;
  player.attackTimer = 0;
  player.attackCooldown = 0;

  for (const enemy of enemies) {
    enemy.alive = true;
    enemy.health = 2;
    enemy.hitFlash = 0;
  }

  gameOver = false;
  victory = false;
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
